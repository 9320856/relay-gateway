name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Repeat tests
        run: go test -count=2 ./...

      - name: Coverage instrumentation
        run: go test -cover ./...

      - name: Static analysis
        run: go vet ./...

      - name: Race detector
        run: go test -race ./...
