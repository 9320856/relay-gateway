<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <meta name="description" content="Relay Gateway 托管媒体资产">
  <title>媒体资产 · Relay Gateway</title>
  <link rel="stylesheet" href="/assets/app.css?v=ui-v0.2.4.1-r1">
  <script defer src="/assets/app.js?v=ui-v0.2.4.1-r1"></script>
</head>
<body data-page="media" translate="no" class="notranslate">
  <div class="app-shell ui-shell">
    <aside class="sidebar" aria-label="侧边栏导航" id="app-sidebar">
      <a class="brand" href="/dashboard"><span class="brand-mark">RG</span><span class="brand-name">Relay Gateway</span></a>
      <nav aria-label="主导航">
        <div class="nav-group">
          <p class="nav-group-label">工作空间</p>
        <a class="nav-link" href="/dashboard" id="nav-dashboard" data-dashboard-view="overview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>概览</span></a>
        <a class="nav-link" href="/dashboard#channels" id="nav-channels" data-dashboard-view="channels"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M12 10v4"/></svg><span>渠道管理</span></a>
        <a class="nav-link" href="/dashboard#playground" id="nav-playground" data-dashboard-view="playground"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg><span>模型调试</span></a>
        </div>
        <div class="nav-group">
          <p class="nav-group-label">资源与观测</p>
        <a class="nav-link" href="/profiles" id="nav-profiles"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>Profile 协议</span></a>
        <a class="nav-link active" href="/media" id="nav-media"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>媒体资产</span></a>
        <a class="nav-link" href="/logs" id="nav-logs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9l-6-6H8Z"/><path d="M14 3v6h6M7 13h10M7 17h7"/></svg><span>调用日志</span></a>
        </div>
      </nav>
      <div class="sidebar-foot">
        <a class="nav-link sidebar-settings" href="/dashboard#settings" id="nav-settings" data-dashboard-view="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.6 2.4-2 .8-2.1-.9L2.3 9.6l1.8 1.6v1.6l-1.8 1.6 2.5 4.3 2.1-.9 2 .8.6 2.4h5l.6-2.4 2-.8 2.1.9 2.5-4.3-1.8-1.6v-1.6l1.8-1.6-2.5-4.3-2.1.9-2-.8-.6-2.4h-5Z"/><circle cx="12" cy="12" r="3"/></svg><span>系统设置</span></a>
        <div class="sidebar-version"><span class="status-dot"></span><span>V0.2.4.1 · 开发测试版</span></div>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <main class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-nav-toggle icon-button" id="mobile-nav-toggle" type="button" aria-label="切换侧边栏导航">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="topbar-title-wrap">
            <span class="workspace-breadcrumb" id="workspace-breadcrumb">资源与观测</span>
            <h1 id="workspace-title">媒体资产</h1>
            <p class="topbar-sub" id="workspace-description">查看保存的媒体文件，管理预览、链接与下载。</p>
          </div>
        </div>
        <div class="account">
          <div class="account-pill" title="当前登录用户">
            <span class="account-avatar" aria-hidden="true">U</span>
            <span id="current-user">—</span>
          </div>
          <button class="button button-ghost-bordered" id="logout-button" type="button" title="退出登录">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            <span>退出</span>
          </button>
        </div>
      </header>

      <section class="panel media-library-panel">
        <div class="panel-head media-panel-head">
          <div>
            <h2>资产库</h2>
            <p class="muted">预览已保存的图片、视频和音频，复制访问链接或下载文件。</p>
          </div>
          <div class="form-actions media-toolbar">
            <label>类型
              <select id="media-kind-filter">
                <option value="">全部类型</option>
                <option value="image">图片</option>
                <option value="video">视频</option>
                <option value="audio">音频</option>
              </select>
            </label>
            <label>状态
              <select id="media-status-filter">
                <option value="">全部状态</option>
                <option value="available">可用</option>
                <option value="pending">排队中</option>
                <option value="materializing">保存中</option>
                <option value="failed">失败</option>
              </select>
            </label>
            <div class="view-switch-group tabs">
              <button class="button compact-btn tab active" id="media-view-grid" type="button" title="画廊视图" aria-label="画廊视图"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>画廊</span></button>
              <button class="button compact-btn tab" id="media-view-table" type="button" title="表格视图" aria-label="表格视图"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg><span>表格</span></button>
            </div>
            <button class="button primary compact-btn" id="media-refresh" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
              <span>刷新</span>
            </button>
          </div>
        </div>

        <div id="media-grid" class="media-gallery-grid"></div>

        <div class="table-wrap hidden" id="media-table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:72px;">预览</th>
                <th>类型</th>
                <th>状态</th>
                <th>大小</th>
                <th>来源任务</th>
                <th>创建时间</th>
                <th class="align-right">操作</th>
              </tr>
            </thead>
            <tbody id="media-list"></tbody>
          </table>
        </div>

        <div class="empty hidden" id="media-empty"><div class="empty-icon-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div><p class="empty-title">暂无媒体资产</p><p class="empty-desc">渠道开启媒体保存后，已保存的文件会出现在这里。</p></div>

        <div class="media-pagination">
          <button class="button ghost" id="media-prev" type="button">上一页</button>
          <span id="media-page-label">第 1 页</span>
          <button class="button ghost" id="media-next" type="button">下一页</button>
        </div>
      </section>
    </main>
  </div>

  <!-- 媒体预览模态框（包含必要选择器契约） -->
  <dialog id="media-preview-dialog" class="media-preview-dialog" aria-labelledby="media-preview-title">
    <div class="dialog-card media-preview-card">
      <div class="media-preview-head">
        <div class="media-preview-title-wrap">
          <h2 id="media-preview-title">媒体预览</h2>
          <span id="media-preview-meta" class="muted font-mono" style="font-size:0.75rem;"></span>
        </div>
        <button class="button ghost compact-btn" id="media-preview-close" type="button">关闭</button>
      </div>

      <div id="media-preview-content" class="media-preview-content"></div>

      <div class="media-preview-footer" id="media-preview-footer">
        <div class="media-preview-link-box">
          <span class="muted font-mono" style="font-size:0.75rem;">直链:</span>
          <input type="text" id="media-preview-url" readonly class="media-preview-url-input">
          <button class="button ghost compact-btn" id="media-preview-copy-btn" type="button">复制公开链接</button>
        </div>
        <div class="media-preview-actions">
          <a class="button ghost compact-btn" id="media-preview-open-ext" target="_blank" rel="noopener noreferrer">在新标签打开</a>
          <a class="button primary compact-btn" id="media-preview-download-btn" download><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg><span>下载</span></a>
        </div>
      </div>
    </div>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
</body>
</html>
