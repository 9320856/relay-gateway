<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <meta name="description" content="Relay Gateway 管理员登录">
  <title>管理员登录 · Relay Gateway</title>
  <link rel="stylesheet" href="/assets/app.css?v=ui-v0.2.4.1-r1">
  <script defer src="/assets/app.js?v=ui-v0.2.4.1-r1"></script>
</head>
<body data-page="login" class="auth-page" translate="no">
  <main class="auth-layout">
    <section class="auth-intro" aria-label="Relay Gateway 简介">
      <a class="brand auth-brand" href="/login"><span class="brand-mark">RG</span><span class="brand-name">Relay Gateway</span></a>
      <div class="auth-intro-copy"><p class="eyebrow">ONE GATEWAY. EVERY MODEL.</p><h2>连接模型，<br>掌控每一次调用。</h2><p>将上游服务接入统一网关，<br>在一个工作空间管理路由、协议与资产。</p></div>
      <ul class="auth-feature-list"><li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01M12 10v4"/></svg><div><strong>统一模型路由</strong><span>集中配置渠道与分发策略</span></div></li><li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><div><strong>灵活协议适配</strong><span>可编辑、可发布的协议版本</span></div></li><li><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9l-6-6H8Z"/><path d="M14 3v6h6M7 13h10M7 17h7"/></svg><div><strong>调用与资产可见</strong><span>查看请求链路和保存的媒体</span></div></li></ul>
      <p class="auth-footnote">V0.2.4.1 · 开发测试版</p>
    </section>
    <section class="auth-card" aria-label="管理员登录">
    <p class="eyebrow"><span class="status-dot"></span>欢迎回来</p>
    <h1>管理员登录</h1>
    <p class="muted">登录你的工作空间，继续管理模型服务。</p>

    <form id="login-form" class="form-stack">
      <label>用户名
        <input name="username" required autocomplete="username" autofocus placeholder="输入管理员用户名">
      </label>
      <label>密码
        <input name="password" type="password" required autocomplete="current-password" placeholder="输入密码">
      </label>
      <button class="button primary block" type="submit">
        <span>登录控制台</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </form>

    <p class="form-error" id="auth-error" role="alert"></p>
    </section>
  </main>
</body>
</html>
